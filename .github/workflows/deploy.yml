name: Deploy theme to Webdock

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview changes without modifying the live theme"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      confirm_production:
        description: "For live deployment choose dry_run=false and type DEPLOY"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: mrsobolle-theme-webdock-production
  cancel-in-progress: false

jobs:
  quality:
    name: Pre-deploy quality checks
    uses: ./.github/workflows/quality.yml

  deploy:
    needs: quality
    name: Deploy WordPress theme to Webdock
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: webdock-production

    env:
      SSH_HOST: "217.78.237.130"
      SSH_PORT: "22"
      SSH_USER: "mrsdeploy"
      SSH_TARGET: "/var/www/mrsobolle-stage/wp-content/themes/mrsobolle"
      DRY_RUN: ${{ inputs.dry_run }}
      CONFIRM_PRODUCTION: ${{ inputs.confirm_production }}

    steps:
      - name: Check required confirmation and production branch
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$DRY_RUN" != "true" && "$DRY_RUN" != "false" ]]; then
            echo "DRY_RUN must be true or false" >&2
            exit 1
          fi
          if [[ "$DRY_RUN" == "false" ]]; then
            if [[ "$CONFIRM_PRODUCTION" != "DEPLOY" ]]; then
              echo "Refusing live deployment without DEPLOY confirmation" >&2
              exit 1
            fi
            if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
              echo "Refusing live deployment from a branch other than main" >&2
              exit 1
            fi
          fi

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure dedicated SSH key and pinned host identity
        shell: bash
        env:
          DEPLOY_PRIVATE_KEY: ${{ secrets.WEBDOCK_DEPLOY_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_PRIVATE_KEY"
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_PRIVATE_KEY" > "$HOME/.ssh/webdock_deploy_key"
          chmod 0600 "$HOME/.ssh/webdock_deploy_key"
          install -m 0600 .github/webdock_known_hosts "$HOME/.ssh/known_hosts"

      - name: Verify restricted SSH user and exact theme target
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/webdock_deploy_key" -p "$SSH_PORT" \
            -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$SSH_USER@$SSH_HOST" \
            'test "$(id -un)" = "mrsdeploy" && test -d /var/www/mrsobolle-stage/wp-content/themes/mrsobolle && test -w /var/www/mrsobolle-stage/wp-content/themes/mrsobolle'

      - name: Archive live theme before real deployment
        if: ${{ inputs.dry_run == 'false' }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/webdock_deploy_key" -p "$SSH_PORT" \
            -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$SSH_USER@$SSH_HOST" \
            "set -eu; mkdir -p ~/deploy-backups; tar -czf ~/deploy-backups/mrsobolle-theme-$GITHUB_RUN_ID.tar.gz -C /var/www/mrsobolle-stage/wp-content/themes mrsobolle; tar -tzf ~/deploy-backups/mrsobolle-theme-$GITHUB_RUN_ID.tar.gz >/dev/null"

      - name: Synchronize theme files (dry-run by default)
        shell: bash
        run: |
          set -euo pipefail
          flags=(-rlptzv --omit-dir-times --delete-delay --delay-updates --max-delete=25 --chmod=D2775,F664 --itemize-changes)
          if [[ "$DRY_RUN" == "true" ]]; then
            flags+=(--dry-run)
            echo "Preview only: no files will be changed."
          fi
          rsync "${flags[@]}" \
            --exclude-from=.deployignore \
            -e "ssh -i $HOME/.ssh/webdock_deploy_key -p $SSH_PORT -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts" \
            ./ "$SSH_USER@$SSH_HOST:$SSH_TARGET/"